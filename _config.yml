# =========================================================
# Bewcastle Cross — site settings
# =========================================================
# Part of the Visionary Cross Project. This repository holds the
# Bewcastle Cross site: the 3DHOP viewer, its pages, panels, and models.

title: Bewcastle Cross
email: humanitiesinnovationlab@gmail.com
description: >-
  A digital edition of the Bewcastle Cross, with an interactive 3D model
  and panel-by-panel iconographic commentary.

# baseurl: the subpath this project site is served from, so that any links
# using relative_url resolve to /bewcastle instead of the domain root (which
# belongs to the project website repo). The 3DHOP content pages use plain relative
# paths (../../assets/css/main.css) and work regardless, but this keeps the
# Jekyll setup identical to the edition. Local `jekyll serve` previews at
# http://localhost:4000/bewcastle/.
baseurl: ""
# url: the base hostname & protocol for the published site.
url: "https://visionarycross.humanitiesinnovationlab.ca"

# remote_theme: pull the shared chrome and styling from the edition repo
# instead of duplicating them here. At build time Jekyll fetches the edition's
# _layouts, _includes, and _sass partials, and compiles its
# assets/css/main.scss into this site's /assets/css/main.css. Edit the styles
# once, in visionary-cross-project/edition, and every cross site picks them
# up on its next build. Any same-named file committed here would override the
# theme's copy, so this repo deliberately keeps no local style sources.
remote_theme: visionary-cross-project/edition

# edition_url: the subpath the edition is served from. The edition is now its
# own repo (visionary-cross-project/edition), published as a project site
# alongside the crosses; the domain root belongs to the separate project
# website. The shared chrome (nav, header, footer) prefixes its frontmatter,
# backmatter, and home links with this, exactly as it does with `crosses`
# below. It must be set in every repo that uses the theme, because
# remote_theme supplies the templates but each site keeps its own config.
edition_url: "/edition"

# Per-cross repositories. Used by the shared nav (from the remote theme) and by
# any page that renders with a Jekyll layout (e.g. the panel stubs). Each cross
# is a project site under this same domain, so these are root-relative paths;
# the nav appends page paths like /model.html, producing /ruthwell/model.html.
crosses:
  ruthwell: "/ruthwell"
  bewcastle: "/bewcastle"
  brussels: "/brussels"

# Shared header (rendered by the theme's _includes/header.html). header_image is
# baseurl-relative, so it resolves to /bewcastle/assets/img/head.jpg.
header_title: "Bewcastle"
header_image: "/assets/img/head.jpg"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-remote-theme

# Sass: partials and assets/css/main.scss now live in the remote theme.
# "expanded" keeps the generated CSS readable; use "compressed" to minify.
sass:
  style: expanded

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
